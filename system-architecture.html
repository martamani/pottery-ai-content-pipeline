document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02Fhelmet>\n\n<div style=\"background:#fbfaf8;color:#16161a;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased\">\n<div style=\"max-width:1120px;margin:0 auto;padding:88px 56px 120px\">\n\n<header style=\"display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:end;padding-bottom:28px;border-bottom:1px solid #16161a\">\n  <div>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8e8e94;margin-bottom:22px\">Case study · Editorial AI systems<\u002Fdiv>\n    <h1 style=\"margin:0;font-size:52px;line-height:1.04;letter-spacing:-0.025em;font-weight:600;max-width:16em;text-wrap:balance\">An AI content pipeline, built end to end<\u002Fh1>\n    <p style=\"margin:20px 0 0;font-size:19px;line-height:1.45;color:#5c5c62;max-width:34em;text-wrap:pretty\">Fourteen steps from source text to published content to automated inbound triage — with the voice governed every time text is generated.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;color:#5c5c62;padding-bottom:6px\">\n    <div style=\"display:flex;gap:10px\"><span style=\"color:#8e8e94;min-width:52px\">FOR<\u002Fspan><span>AI Content Pipeline<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><span style=\"color: rgb(142, 142, 148); min-width: 52px;\">BY<\u002Fspan><span>Marta Romani<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><span style=\"color:#8e8e94;min-width:52px\">SITE<\u002Fspan><a href=\"https://martamani.github.io/pottery-ai-content-pipeline/\">martamani.github.io<\u002Fa><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><span style=\"color:#8e8e94;min-width:52px\">REPO<\u002Fspan><a href=\"https://github.com/martamani/pottery-ai-content-pipeline\">pottery-ai-content-pipeline<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"display:grid;grid-template-columns:200px 1fr;gap:56px;padding:44px 0 8px;border-bottom:1px solid #e4e2dd\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8e8e94;padding-top:5px\">Premise<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:16px;padding-bottom:40px\">\n    <p style=\"margin:0;font-size:17px;line-height:1.6;max-width:44em;text-wrap:pretty\">I have been learning how to design systems that automate editorial processes — styleguide creation, LLM evaluation, lead-capture automation. I am now putting the pieces together into an AI editorial system.<\u002Fp>\n    <p style=\"margin:0;font-size:17px;line-height:1.6;color:#5c5c62;max-width:44em;text-wrap:pretty\">The subject is my pottery studio. I have written the source text.&nbsp;<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:56px 0 0\">\n  <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:8px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8e8e94\">01 / System<\u002Fdiv>\n  <\u002Fdiv>\n  <h2 style=\"margin:0 0 6px;font-size:30px;line-height:1.15;letter-spacing:-0.02em;font-weight:600\">The architecture<\u002Fh2>\n  <p style=\"margin:0 0 40px;font-size:16px;color:#5c5c62;max-width:40em;text-wrap:pretty\">Five stages, plus one governance layer. Editorial guidelines are written once and referenced by every text generation, not re-prompted every time time.<\u002Fp>\n\n  <div style=\"background:#ffffff;border:1px solid #e4e2dd;padding:44px 40px 40px\">\n    <div style=\"display:grid;grid-template-columns:1fr 22px 1fr 22px 1fr 22px 1fr 22px 1fr;align-items:stretch;gap:0\">\n\n      <div style=\"border-top:2px solid #16161a;padding-top:14px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#8e8e94\">STAGE 01<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">Source<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.45;color:#5c5c62\">Human-written text and a static site — the ground truth.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94\">GitHub Pages<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#b4b2ad\">→<\u002Fdiv>\n\n      <div style=\"border-top:2px solid #16161a;padding-top:14px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#8e8e94\">STAGE 02<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">Baseline<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.45;color:#5c5c62\">Measure visibility against one competitor craftsman. Benchmark only, never an input to drafts.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94\">AirOps audit<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#b4b2ad\">→<\u002Fdiv>\n\n      <div style=\"border-top:2px solid #4c5f8f;padding-top:14px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#4c5f8f\">STAGE 03<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">Generate, grounded<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.45;color:#5c5c62\">Drafts are grounded in the text I wrote. Machine-readable schema on top.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94\">Quill · JSON-LD<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#b4b2ad\">→<\u002Fdiv>\n\n      <div style=\"border-top:2px solid #4c5f8f;padding-top:14px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#4c5f8f\">STAGE 04<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">Distribute<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.45;color:#5c5c62\">One source of content, repurposed into several formats. A human edit pass before anything ships.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94\">AirOps · human QA<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#b4b2ad\">→<\u002Fdiv>\n\n      <div style=\"border-top:2px solid #4c5f8f;padding-top:14px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#4c5f8f\">STAGE 05<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">Orchestrate<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.45;color:#5c5c62\">Inbound messages captured, routed by length, summarised and classified as leads/not leads, sent weekly to my email drafts folder.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94\">Tally · Make.com<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"grid-column:1 / 4;display:flex;justify-content:center;padding-top:20px\"><\u002Fdiv>\n      <div style=\"grid-column:5 / 10;display:flex;justify-content:space-around;padding-top:20px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#4c5f8f\">\n        <span>↑<\u002Fspan><span>↑<\u002Fspan><span>↑<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"grid-column:5 / 10;background:#f3f4f8;border:1px solid #c3cbdd;padding:16px 20px;display:flex;align-items:center;gap:20px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#4c5f8f;white-space:nowrap\">GOVERNANCE LAYER<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.45;color:#3c3c42\">AirOps Brand kit — voice, tone and six written rules, stored once and used every time text is generated.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"grid-column:1 / 4;padding-top:0\"><\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e4e2dd;border:1px solid #e4e2dd;margin-top:32px\">\n    <div style=\"background:#fbfaf8;padding:24px 26px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#8e8e94;margin-bottom:10px\">DESIGN PRINCIPLE 01<\u002Fdiv>\n      <div style=\"font-size:15.5px;font-weight:600;margin-bottom:7px;letter-spacing:-0.01em\">Ground, don't trust<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:#5c5c62;text-wrap:pretty\">Generation reads from the live site. When the site was still offline, the agent flagged it. It did not invent an FAQ.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fbfaf8;padding:24px 26px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#8e8e94;margin-bottom:10px\">DESIGN PRINCIPLE 02<\u002Fdiv>\n      <div style=\"font-size:15.5px;font-weight:600;margin-bottom:7px;letter-spacing:-0.01em\">Set voice once<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:#5c5c62;text-wrap:pretty\">The editorial guidelines live in the brand kit, not in a prompt. They are used every time text is generated.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fbfaf8;padding:24px 26px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#8e8e94;margin-bottom:10px\">DESIGN PRINCIPLE 03<\u002Fdiv>\n      <div style=\"font-size:15.5px;font-weight:600;margin-bottom:7px;letter-spacing:-0.01em\">Design for free tier<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:#5c5c62;text-wrap:pretty\">When a platform limit blocked the API call, the logic was rebuilt on a free tier with Google Sheets.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:80px 0 0\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8e8e94;margin-bottom:8px\">02 / Evidence<\u002Fdiv>\n  <h2 style=\"margin:0 0 6px;font-size:30px;line-height:1.15;letter-spacing:-0.02em;font-weight:600\">Fourteen steps<\u002Fh2>\n  <p style=\"margin:0 0 8px;font-size:16px;color:#5c5c62;max-width:40em;text-wrap:pretty\">All built.<\u002Fp>\n\n  <div style=\"margin-top:36px;display:flex;flex-direction:column;gap:0\">\n\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:56px;padding:32px 0;border-top:1px solid #16161a\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#8e8e94;margin-bottom:6px\">STAGE 01<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">Source<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;max-width:46em\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">01<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Wrote the source text<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">The maker's own brand story, in Spanish, first person. All content is measured against this voice.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">HUMAN<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">02<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Built the site<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">Static site on GitHub Pages: homepage, pieces, process. A crawlable site for the pipeline to read from.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">GITHUB PAGES · JEKYLL<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:56px;padding:32px 0;border-top:1px solid #e4e2dd\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#8e8e94;margin-bottom:6px\">STAGE 02<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">Baseline<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;max-width:46em\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">03<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Ran an onboarding audit<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">Baseline mention and citation rate against one competitor, recorded before any content was generated. Held as a benchmark, not for content drafts.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">AIROPS<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:56px;padding:32px 0;border-top:1px solid #e4e2dd\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#4c5f8f;margin-bottom:6px\">STAGE 03<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">Generate, grounded<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;max-width:46em\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">04<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Generated the FAQ from the live site<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">A Quill agent drafted the FAQ grounded in the site's own content. On the first attempt, before the site was live, it reported that it had no content to draw from rather than hallucinate — the grounding worked as designed.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">AIROPS QUILL<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">05<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Added structured data<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">FAQPage JSON-LD on the FAQ page, so answer engines can cite it as structured content.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">SCHEMA.ORG JSON-LD<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:56px;padding:32px 0;border-top:1px solid #e4e2dd;background:#f3f4f8\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#4c5f8f;margin-bottom:6px\">GOVERNANCE<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">Set the voice<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.45;color:#5c5c62;margin-top:8px\">The layer that makes the rest repeatable.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;max-width:46em\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#a3aabd;padding-top:2px\">06<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Wrote the editorial guidelines<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#3c3c42\">I edited the LLM draft against my own voice. Six rules, derived from my corrections: cut redundant adverbs, avoid technical language, match register to context, keep opposing pairs parallel, present tense for facts still true, keep the humbling tone.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">CLAUDE · HUMAN CORRECTION<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#a3aabd;padding-top:2px\">07<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Loaded them into the brand kit<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#3c3c42\">Stored in the Voice &amp; Tone so generated text reads the same rules.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">AIROPS BRAND KIT<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:56px;padding:32px 0;border-top:1px solid #e4e2dd\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#4c5f8f;margin-bottom:6px\">STAGE 04<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">Distribute<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;max-width:46em\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">08<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Repurposed the content<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">Site content repuporsed as a LinkedIn post and an Instagram caption, generated against the stored voice.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">AIROPS QUILL<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">09<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Edited the draft against the guidelines<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">Cut redundant adverbs, fixed a tense mismatch, corrected a mismatched word pair, adjusted capitalisation for register. Each edit logged as a before-and-after, making the rules<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">HUMAN · FINAL PASS<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">10<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Tested whether the brand kit actually works<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">Generated a piece of care-instruction copy using only the stored voice. The governance layer is doing the work.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">AIROPS · EVALUATION<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">11<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Published<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">Live on GitHub Pages with the schema in the page source. Headings, links, images and metadata checked before release.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">GITHUB PAGES<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:56px;padding:32px 0;border-top:1px solid #e4e2dd\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#4c5f8f;margin-bottom:6px\">STAGE 05<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">Orchestrate<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;max-width:46em\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">12<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Built the inbound capture<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">A Tally form wired into a Make.com scenario. A router condition: anything over roughly a hundred words goes to summarisation and lead classification first. Anything shorter goes straight to the weekly digest.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">TALLY · MAKE.COM<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">13<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Hit a platform limit<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">The classification step ran as a published AirOps workflow called over its webhook API. Routing, payload structure and authentication all tested correctly; execution was refused because external API calls need a paid tier, confirmed by the API's error.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">AIROPS WEBHOOK API<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:18px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b4b2ad;padding-top:2px\">14<\u002Fdiv>\n          <div>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:4px\">Rebuilt it on free tier<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:#5c5c62\">Same triage logic, moved off the paid API: submissions land in a Google Sheet, an AirOps Grid runs the classification per row, and a weekly digest reads the enriched sheet. In progress.<\u002Fdiv>\n            <sc-if value=\"{{ showToolTags }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:8px\">SHEETS · AIROPS GRID · MAKE.COM<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:80px 0 0\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8e8e94;margin-bottom:8px\">03 / Constraint<\u002Fdiv>\n  <h2 style=\"margin:0 0 6px;font-size:30px;line-height:1.15;letter-spacing:-0.02em;font-weight:600\">One route closed, so the logic moved<\u002Fh2>\n  <p style=\"margin:0 0 36px;font-size:16px;color:#5c5c62;max-width:40em;text-wrap:pretty\">I needed a subscription. The triage logic was not the problem; where it executed was. So it moved.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:1fr 40px 1fr;align-items:stretch;gap:0\">\n    <div style=\"background:#ffffff;border:1px solid #e4e2dd;padding:28px 30px\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n        <div style=\"width:7px;height:7px;background:#8f5a45\"><\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#8f5a45\">ATTEMPTED · BLOCKED<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#3c3c42\">\n        <div style=\"padding:9px 0;border-bottom:1px dashed #e4e2dd\">Tally form<\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px dashed #e4e2dd\">Make.com router — length split<\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px dashed #e4e2dd\">HTTP module → AirOps webhook<\u002Fdiv>\n        <div style=\"padding:9px 0;color:#8f5a45\">✕ external API requires paid tier<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #e4e2dd;font-size:13.5px;line-height:1.5;color:#5c5c62;text-wrap:pretty\">The workflow passed the test. There were no bugs. I needed a subscription.&nbsp;<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#b4b2ad\">→<\u002Fdiv>\n\n    <div style=\"background:#ffffff;border:1px solid #4c5f8f;padding:28px 30px\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n        <div style=\"width:7px;height:7px;background:#4c5f8f\"><\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#4c5f8f\">REDESIGNED · SAME LOGIC<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#3c3c42\">\n        <div style=\"padding:9px 0;border-bottom:1px dashed #e4e2dd\">Tally form<\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px dashed #e4e2dd\">Make.com → Google Sheets<\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px dashed #e4e2dd\">AirOps Grid — classify per row<\u002Fdiv>\n        <div style=\"padding:9px 0;color:#4c5f8f\">✓ weekly digest from enriched sheet<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #e4e2dd;font-size:13.5px;line-height:1.5;color:#5c5c62;text-wrap:pretty\">The workaround. Batch rather than per-event, it's a tradeoff — and the right one for weekly inbound volume.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:80px 0 0\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8e8e94;margin-bottom:8px\">04 / Artefacts<\u002Fdiv>\n  <h2 style=\"margin:0 0 36px;font-size:30px;line-height:1.15;letter-spacing:-0.02em;font-weight:600\">What it looks like in the tools<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px\">\n    <div style=\"min-width:0\">\n      <div style=\"border:1px solid #e4e2dd;background:#ffffff;padding:10px\">\n        <image-slot id=\"artefact-brandkit\" shape=\"rect\" style=\"width:100%;height:300px\" placeholder=\"AirOps Brand Kit — Voice &amp; Tone field\" src=\"18fbfc98-b155-491f-9b01-4248d839cb8e\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:12px\">FIG. 01 — BRAND KIT, VOICE &amp; TONE<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:#5c5c62;margin-top:6px;max-width:30em\">The styleguide as it sits in the platform. Steps 04, 08 and 10 read from this field.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"min-width:0\">\n      <div style=\"border:1px solid #e4e2dd;background:#ffffff;padding:10px\">\n        <image-slot id=\"artefact-workflow\" shape=\"rect\" style=\"width:100%;height:300px\" placeholder=\"AirOps workflow / Make.com scenario\" src=\"c38254f2-116e-4c23-9c7c-a1591967de05\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8e8e94;margin-top:12px\">FIG. 02 — THE ORCHESTRATION<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:#5c5c62;margin-top:6px;max-width:30em\">Router, branches and the classification step, with the tier error that redirected the design.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showRoleMapping }}\" hint-placeholder-val=\"{{ true }}\">\n\n<\u002Fsc-if>\n\n<footer style=\"margin-top:88px;padding-top:28px;border-top:1px solid #16161a;display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:start\">\n  <div style=\"font-size:16px;line-height:1.55;color:#3c3c42;max-width:34em;text-wrap:pretty\">The pipeline runs on a pottery studio, but nothing is specific to pottery. Swap the content, keep the architecture: grounded generation, one governance layer, a human editor, and orchestration.<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5c5c62\">\n    <a href=\"https://martamani.github.io/pottery-ai-content-pipeline/\">Live site ↗<\u002Fa>\n    <a href=\"https://github.com/martamani/pottery-ai-content-pipeline\">Repository ↗<\u002Fa>\n    \n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showToolTags&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showRoleMapping&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showToolTags: this.props.showToolTags ?? true,\n      showRoleMapping: this.props.showRoleMapping ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

<svg width="760" height="1500" viewBox="0 0 760 1500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="760" height="1500" fill="#ffffff"/>
<text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Pottery AI Content Pipeline — Step by Step</text>

<!-- helper grid: steps at y positions, 100px apart starting 70 -->

<!-- Step 1 -->
<rect x="130" y="60" width="500" height="52" rx="8" fill="#f3f3f3" stroke="#999" stroke-width="0.5"/>
<text x="380" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">1. Wrote the source text</text>
<text x="380" y="98" text-anchor="middle" font-size="11" fill="#555">Marta wrote the pottery brand story and product descriptions, in Spanish, first person</text>
<line x1="380" y1="112" x2="380" y2="144" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 2 -->
<rect x="130" y="144" width="500" height="52" rx="8" fill="#f3f3f3" stroke="#999" stroke-width="0.5"/>
<text x="380" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2. Built the site</text>
<text x="380" y="182" text-anchor="middle" font-size="11" fill="#555">GitHub Pages: homepage, pieces, and process pages from that text</text>
<line x1="380" y1="196" x2="380" y2="228" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 3 -->
<rect x="130" y="228" width="500" height="60" rx="8" fill="#ece6fa" stroke="#8866cc" stroke-width="0.5"/>
<text x="380" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">3. AirOps onboarding audit</text>
<text x="380" y="266" text-anchor="middle" font-size="11" fill="#555">Baseline AI-visibility report: mention rate, citation rate, vs. one competitor</text>
<text x="380" y="281" text-anchor="middle" font-size="10" fill="#888">(separate from FAQ generation — used to benchmark, not to draft)</text>
<line x1="380" y1="288" x2="380" y2="320" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 4 -->
<rect x="130" y="320" width="500" height="52" rx="8" fill="#ece6fa" stroke="#8866cc" stroke-width="0.5"/>
<text x="380" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">4. Quill (AirOps) generated the FAQ</text>
<text x="380" y="358" text-anchor="middle" font-size="11" fill="#555">Grounded in the live site's own content — flagged when the site wasn't live yet</text>
<line x1="380" y1="372" x2="380" y2="404" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 5 -->
<rect x="130" y="404" width="500" height="52" rx="8" fill="#e2f3f1" stroke="#3a9c8e" stroke-width="0.5"/>
<text x="380" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">5. Added GEO schema</text>
<text x="380" y="442" text-anchor="middle" font-size="11" fill="#555">FAQPage JSON-LD markup added to the FAQ page for AI search citability</text>
<line x1="380" y1="456" x2="380" y2="488" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 6 -->
<rect x="130" y="488" width="500" height="52" rx="8" fill="#f3f3f3" stroke="#999" stroke-width="0.5"/>
<text x="380" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">6. Drafted editorial guidelines</text>
<text x="380" y="526" text-anchor="middle" font-size="11" fill="#555">Claude drafted the styleguide; Marta corrected it against her own voice</text>
<line x1="380" y1="540" x2="380" y2="572" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 7 -->
<rect x="130" y="572" width="500" height="52" rx="8" fill="#ece6fa" stroke="#8866cc" stroke-width="0.5"/>
<text x="380" y="592" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">7. Loaded guidelines into AirOps</text>
<text x="380" y="610" text-anchor="middle" font-size="11" fill="#555">Pasted into the Brand Kit's Voice & Tone field, for future generations to use</text>
<line x1="380" y1="624" x2="380" y2="656" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 8 -->
<rect x="130" y="656" width="500" height="52" rx="8" fill="#ece6fa" stroke="#8866cc" stroke-width="0.5"/>
<text x="380" y="676" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">8. Quill generated repurposed content</text>
<text x="380" y="694" text-anchor="middle" font-size="11" fill="#555">A LinkedIn post and an Instagram caption from the same source content</text>
<line x1="380" y1="708" x2="380" y2="740" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 9 -->
<rect x="130" y="740" width="500" height="52" rx="8" fill="#e2f3f1" stroke="#3a9c8e" stroke-width="0.5"/>
<text x="380" y="760" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">9. Edited the AI draft</text>
<text x="380" y="778" text-anchor="middle" font-size="11" fill="#555">Manual pass against the styleguide: tense, tone, redundant words, register</text>
<line x1="380" y1="792" x2="380" y2="824" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 10 -->
<rect x="130" y="824" width="500" height="52" rx="8" fill="#ece6fa" stroke="#8866cc" stroke-width="0.5"/>
<text x="380" y="844" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">10. Tested the Brand Kit</text>
<text x="380" y="862" text-anchor="middle" font-size="11" fill="#555">Asked Quill to write care instructions using the stored voice guidelines — it worked</text>
<line x1="380" y1="876" x2="380" y2="908" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 11 -->
<rect x="130" y="908" width="500" height="52" rx="8" fill="#f3f3f3" stroke="#999" stroke-width="0.5"/>
<text x="380" y="928" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">11. Published the site</text>
<text x="380" y="946" text-anchor="middle" font-size="11" fill="#555">Live on GitHub Pages, FAQ schema included</text>
<line x1="380" y1="960" x2="380" y2="992" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 12 -->
<rect x="130" y="992" width="500" height="52" rx="8" fill="#f3f3f3" stroke="#999" stroke-width="0.5"/>
<text x="380" y="1012" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">12. Built a contact form</text>
<text x="380" y="1030" text-anchor="middle" font-size="11" fill="#555">Tally form, wired to Make.com with conditional routing by message length</text>
<line x1="380" y1="1044" x2="380" y2="1076" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 13 -->
<rect x="130" y="1076" width="500" height="64" rx="8" fill="#fbe2e2" stroke="#cc4444" stroke-width="0.5"/>
<text x="380" y="1096" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33">13. Attempted AirOps automation — blocked</text>
<text x="380" y="1114" text-anchor="middle" font-size="11" fill="#a33">Messages over ~100 words → AirOps webhook to summarize + classify (lead / not lead)</text>
<text x="380" y="1129" text-anchor="middle" font-size="10" fill="#a33">Blocked: external API calls require a paid AirOps tier</text>
<line x1="380" y1="1140" x2="380" y2="1172" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

<!-- Step 14 -->
<rect x="130" y="1172" width="500" height="64" rx="8" fill="#fff6e0" stroke="#c99a2e" stroke-width="0.5"/>
<text x="380" y="1192" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1f">14. Redesigned — free alternative (in progress)</text>
<text x="380" y="1210" text-anchor="middle" font-size="11" fill="#8a6a1f">Google Sheets stores submissions; an AirOps Grid (no paywall) runs the same</text>
<text x="380" y="1225" text-anchor="middle" font-size="11" fill="#8a6a1f">triage logic; Make.com sends a weekly Gmail digest of the results</text>

<text x="380" y="1280" text-anchor="middle" font-size="11" fill="#777">Every generation step (4, 8, 10) draws on the same Brand Kit and styleguide, set once in step 7</text>
</svg>
